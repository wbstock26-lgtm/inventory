<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — Little Red Deer Store</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --fg: #1a1a1a;
    --fg2: #555;
    --accent: #c0392b;
    --accent-hover: #a93226;
    --border: #ddd;
    --red: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a;
      --surface: #242424;
      --fg: #f0f0f0;
      --fg2: #aaa;
      --border: #3a3a3a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo-icon { font-size: 40px; }
  .logo-title {
    font-size: 18px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--fg);
  }
  .logo-sub {
    font-size: 13px;
    color: var(--fg2);
    margin-top: 2px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg2);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--fg);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .btn-login:hover { background: var(--accent-hover); }
  .btn-login:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none;
    color: var(--red);
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🦌</div>
    <div class="logo-title">Little Red Deer Store</div>
    <div class="logo-sub">재고 관리 시스템</div>
  </div>
  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" placeholder="아이디 입력" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
    </div>
    <button class="btn-login" type="submit" id="loginBtn">로그인</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
const API = 'http://127.0.0.1:8000';

// 이미 로그인된 경우 메인으로
(async () => {
  const token = localStorage.getItem('authToken');
  if (token) {
    const r = await fetch(`${API}/api/auth/check?token=${encodeURIComponent(token)}`).catch(() => null);
    if (r && r.ok) { location.replace('/inventory.html'); return; }
    localStorage.removeItem('authToken');
  }
})();

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    errEl.textContent = '아이디와 비밀번호를 입력하세요';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = '로그인 중…';
  errEl.classList.remove('show');

  try {
    const r = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.detail || '로그인 실패');
    }
    const { token } = await r.json();
    localStorage.setItem('authToken', token);
    location.replace('/inventory.html');
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = '로그인';
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
