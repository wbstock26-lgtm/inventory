<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — Little Red Deer Store</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --fg: #1a1a1a;
    --fg2: #555;
    --accent: #c0392b;
    --accent-hover: #a93226;
    --border: #ddd;
    --red: #c0392b;
    --success: #1e8449;
    --success-bg: #eafaf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a;
      --surface: #242424;
      --fg: #f0f0f0;
      --fg2: #aaa;
      --border: #3a3a3a;
      --success-bg: #0d2b1c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo-icon { font-size: 40px; }
  .logo-title {
    font-size: 18px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--fg);
  }
  .logo-sub {
    font-size: 13px;
    color: var(--fg2);
    margin-top: 2px;
  }

  /* 탭 */
  .tabs {
    display: flex;
    border-bottom: 1.5px solid var(--border);
    margin-bottom: 24px;
    gap: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 9px 0;
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg2);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1.5px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg2);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--fg);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .msg {
    display: none;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    padding: 8px 12px;
    border-radius: 6px;
  }
  .msg.error { display: block; color: var(--red); background: #fdf0ef; }
  .msg.success { display: block; color: var(--success); background: var(--success-bg); }
  .hint { font-size: 12px; color: var(--fg2); margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🦌</div>
    <div class="logo-title">Little Red Deer Store</div>
    <div class="logo-sub">재고 관리 시스템</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
    <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">계정 등록</button>
  </div>

  <!-- 로그인 패널 -->
  <div class="panel active" id="panelLogin">
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" placeholder="아이디 입력" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="loginBtn">로그인</button>
      <div class="msg" id="loginMsg"></div>
      <div style="text-align:center; margin-top:14px;">
        <a href="#" id="resetLink" onclick="resetPassword()" style="font-size:13px; color:var(--fg2); text-decoration:none; border-bottom:1px dashed var(--fg2);">비밀번호를 잊으셨나요?</a>
      </div>
    </form>
  </div>

  <!-- 계정 등록 패널 -->
  <div class="panel" id="panelRegister">
    <form id="registerForm" autocomplete="off">
      <div class="field">
        <label for="regUsername">새 아이디</label>
        <input id="regUsername" type="text" placeholder="아이디 입력 (2자 이상)" autocomplete="username">
      </div>
      <div class="field">
        <label for="regPassword">새 비밀번호</label>
        <input id="regPassword" type="password" placeholder="비밀번호 입력 (4자 이상)" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="regConfirm">비밀번호 확인</label>
        <input id="regConfirm" type="password" placeholder="비밀번호 재입력" autocomplete="new-password">
      </div>
      <button class="btn" type="submit" id="registerBtn">계정 등록</button>
      <div class="msg" id="registerMsg"></div>
    </form>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

// 이미 로그인된 경우 메인으로
(async () => {
  const token = localStorage.getItem('authToken');
  if (token) {
    const r = await fetch(`${API}/api/auth/check?token=${encodeURIComponent(token)}`).catch(() => null);
    if (r && r.ok) { location.replace('/inventory.html'); return; }
    localStorage.removeItem('authToken');
  }
  // 기본 계정인 경우 등록 탭으로 자동 전환
  const dr = await fetch(`${API}/api/auth/is-default`).catch(() => null);
  if (dr && dr.ok) {
    const { default: isDefault } = await dr.json();
    if (isDefault) switchTab('register');
  }
})();

function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
  document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
  if (tab === 'login') document.getElementById('username').focus();
  else document.getElementById('regUsername').focus();
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

// 로그인
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) return showMsg('loginMsg', '아이디와 비밀번호를 입력하세요', 'error');

  btn.disabled = true;
  btn.textContent = '로그인 중…';
  document.getElementById('loginMsg').className = 'msg';

  try {
    const r = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || '로그인 실패');
    }
    const { token } = await r.json();
    localStorage.setItem('authToken', token);
    location.replace('/inventory.html');
  } catch (err) {
    showMsg('loginMsg', err.message, 'error');
    btn.disabled = false;
    btn.textContent = '로그인';
    document.getElementById('password').focus();
  }
});

// 비밀번호 초기화
async function resetPassword() {
  if (!confirm('비밀번호를 초기화하면 기본 계정(admin / admin1234)으로 돌아갑니다.\n계속하시겠습니까?')) return;
  try {
    const r = await fetch(`${API}/api/auth/reset`, { method: 'POST' });
    if (r.ok) {
      showMsg('loginMsg', '초기화 완료! 계정 등록 탭에서 새 계정을 만드세요.', 'success');
      setTimeout(() => switchTab('register'), 1500);
    } else {
      showMsg('loginMsg', '초기화 실패. 다시 시도해주세요.', 'error');
    }
  } catch {
    showMsg('loginMsg', '서버 연결 오류가 발생했습니다.', 'error');
  }
}

// 계정 등록
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;

  if (!username) return showMsg('registerMsg', '아이디를 입력하세요', 'error');
  if (username.length < 2) return showMsg('registerMsg', '아이디는 2자 이상이어야 합니다', 'error');
  if (!password) return showMsg('registerMsg', '비밀번호를 입력하세요', 'error');
  if (password.length < 4) return showMsg('registerMsg', '비밀번호는 4자 이상이어야 합니다', 'error');
  if (password !== confirm) return showMsg('registerMsg', '비밀번호가 일치하지 않습니다', 'error');

  btn.disabled = true;
  btn.textContent = '등록 중…';
  document.getElementById('registerMsg').className = 'msg';

  try {
    const r = await fetch(`${API}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || '등록 실패');
    }
    showMsg('registerMsg', '계정이 등록되었습니다! 로그인해주세요.', 'success');
    setTimeout(() => {
      document.getElementById('username').value = username;
      document.getElementById('password').value = '';
      switchTab('login');
      document.getElementById('password').focus();
    }, 1200);
  } catch (err) {
    showMsg('registerMsg', err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '계정 등록';
  }
});
</script>
</body>
</html>
