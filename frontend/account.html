<!DOCTYPE html>
<title>계정 설정 — Little Red Deer Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/auth.js"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #c0392b;
    --accent-hover: #a93226;
    --success: #2ecc71;
    --error-bg: #fdf0ef;
    --error-fg: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e; --card: #2c2c2e; --fg: #f2f2f7;
      --muted: #98989d; --border: #3a3a3c;
      --error-bg: #3a1a1a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e; --card: #2c2c2e; --fg: #f2f2f7;
    --muted: #98989d; --border: #3a3a3c;
    --error-bg: #3a1a1a; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--fg);
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 48px;
  }
  .back-link {
    position: fixed; top: 20px; left: 20px;
    color: var(--accent); font-size: 14px; text-decoration: none;
    display: flex; align-items: center; gap: 4px;
  }
  .back-link:hover { opacity: 0.8; }
  .container { width: 100%; max-width: 440px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 24px; text-align: center; }
  .card {
    background: var(--card); border-radius: 16px;
    padding: 28px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 16px;
  }
  .current-info {
    font-size: 15px; color: var(--fg);
    padding: 10px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .current-info span { color: var(--muted); font-size: 13px; display: block; margin-bottom: 2px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 15px; background: var(--bg); color: var(--fg);
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btn {
    width: 100%; padding: 13px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; margin-top: 4px;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .msg {
    padding: 10px 14px; border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; display: none;
  }
  .msg.error { background: var(--error-bg); color: var(--error-fg); display: block; }
  .msg.success { background: #eafaf1; color: #1e8449; display: block; }
  .logout-btn {
    width: 100%; padding: 13px;
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: all 0.15s;
  }
  .logout-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>

<a class="back-link" href="/inventory.html">← 돌아가기</a>

<div class="container">
  <h1>⚙️ 계정 설정</h1>

  <div class="card">
    <div class="card-title">현재 계정</div>
    <div class="current-info">
      <span>아이디</span>
      <strong id="currentUsername">불러오는 중…</strong>
    </div>
  </div>

  <div class="card">
    <div class="card-title">아이디 / 비밀번호 변경</div>
    <div class="msg" id="msg"></div>

    <div class="field">
      <label>새 아이디 (변경하지 않으면 비워두세요)</label>
      <input type="text" id="newUsername" placeholder="새 아이디 입력" autocomplete="username">
    </div>
    <div class="field">
      <label>새 비밀번호 (변경하지 않으면 비워두세요)</label>
      <input type="password" id="newPassword" placeholder="새 비밀번호 입력" autocomplete="new-password">
      <div class="hint">최소 4자 이상</div>
    </div>
    <div class="field">
      <label>새 비밀번호 확인</label>
      <input type="password" id="confirmPassword" placeholder="비밀번호 재입력" autocomplete="new-password">
    </div>
    <div class="field">
      <label>현재 비밀번호 <span style="color:var(--accent)">*</span></label>
      <input type="password" id="currentPassword" placeholder="현재 비밀번호 (필수)" autocomplete="current-password">
    </div>

    <button class="btn" id="saveBtn" onclick="save()">저장</button>
  </div>

  <!-- 사용자 관리 (admin 전용) -->
  <div class="card" id="userMgmtCard" style="display:none">
    <div class="card-title">사용자 관리</div>
    <div id="userList" style="margin-bottom:16px;"></div>

    <div style="border-top:1px solid var(--border); padding-top:16px;">
      <div style="font-size:13px; font-weight:600; color:var(--muted); margin-bottom:12px;">새 계정 추가</div>
      <div class="field">
        <label>아이디</label>
        <input type="text" id="newUserName" placeholder="아이디 (2자 이상)">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="newUserPw" placeholder="비밀번호 (4자 이상)">
      </div>
      <div class="msg" id="userMgmtMsg"></div>
      <button class="btn" onclick="addUser()">추가</button>
    </div>
  </div>

  <div class="card">
    <button class="logout-btn" onclick="authLogout()">로그아웃</button>
  </div>
</div>

<script>
  const API = 'http://127.0.0.1:8000';

  async function loadUsername() {
    const token = localStorage.getItem('authToken');
    try {
      const r = await fetch(`${API}/api/auth/me?token=${encodeURIComponent(token)}`);
      if (r.ok) {
        const data = await r.json();
        document.getElementById('currentUsername').textContent = data.username;
        if (data.role === 'admin') {
          document.getElementById('userMgmtCard').style.display = '';
          loadUserList();
        }
      }
    } catch {}
  }

  async function loadUserList() {
    const token = localStorage.getItem('authToken');
    try {
      const r = await fetch(`${API}/api/auth/users?token=${encodeURIComponent(token)}`);
      if (!r.ok) return;
      const users = await r.json();
      const el = document.getElementById('userList');
      el.innerHTML = users.map(u => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
          <div>
            <span style="font-size:15px;font-weight:600;">${u.username}</span>
            <span style="font-size:12px;color:var(--muted);margin-left:8px;background:var(--bg);padding:2px 8px;border-radius:10px;">${u.role === 'admin' ? '관리자' : 'Split 전용'}</span>
          </div>
          ${u.username !== 'admin' ? `<button onclick="deleteUser('${u.username}')" style="background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;">삭제</button>` : ''}
        </div>
      `).join('');
    } catch {}
  }

  async function addUser() {
    const token = localStorage.getItem('authToken');
    const username = document.getElementById('newUserName').value.trim();
    const password = document.getElementById('newUserPw').value;
    const msgEl = document.getElementById('userMgmtMsg');
    if (!username || username.length < 2) return showUserMsg('아이디는 2자 이상이어야 합니다', 'error');
    if (!password || password.length < 4) return showUserMsg('비밀번호는 4자 이상이어야 합니다', 'error');
    try {
      const r = await fetch(`${API}/api/auth/users/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, username, password, role: 'split' }),
      });
      if (r.ok) {
        document.getElementById('newUserName').value = '';
        document.getElementById('newUserPw').value = '';
        showUserMsg('추가되었습니다.', 'success');
        loadUserList();
      } else {
        const d = await r.json().catch(() => ({}));
        showUserMsg(d.detail || '오류가 발생했습니다.', 'error');
      }
    } catch { showUserMsg('서버 오류가 발생했습니다.', 'error'); }
  }

  async function deleteUser(username) {
    if (!confirm(`'${username}' 계정을 삭제하시겠습니까?`)) return;
    const token = localStorage.getItem('authToken');
    try {
      const r = await fetch(`${API}/api/auth/users/${encodeURIComponent(username)}?token=${encodeURIComponent(token)}`, { method: 'DELETE' });
      if (r.ok) { showUserMsg('삭제되었습니다.', 'success'); loadUserList(); }
      else { const d = await r.json().catch(() => ({})); showUserMsg(d.detail || '오류', 'error'); }
    } catch { showUserMsg('서버 오류가 발생했습니다.', 'error'); }
  }

  function showUserMsg(text, type) {
    const el = document.getElementById('userMgmtMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(() => { el.className = 'msg'; }, 3000);
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function save() {
    const newUsername = document.getElementById('newUsername').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const currentPassword = document.getElementById('currentPassword').value;

    if (!currentPassword) return showMsg('현재 비밀번호를 입력해주세요.', 'error');
    if (!newUsername && !newPassword) return showMsg('변경할 아이디 또는 비밀번호를 입력해주세요.', 'error');
    if (newPassword && newPassword !== confirmPassword) return showMsg('새 비밀번호가 일치하지 않습니다.', 'error');
    if (newPassword && newPassword.length < 4) return showMsg('새 비밀번호는 4자 이상이어야 합니다.', 'error');
    if (newUsername && newUsername.length < 2) return showMsg('아이디는 2자 이상이어야 합니다.', 'error');

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '저장 중…';

    try {
      const token = localStorage.getItem('authToken');
      const body = { token, current_password: currentPassword };
      if (newUsername) body.new_username = newUsername;
      if (newPassword) body.new_password = newPassword;

      const r = await fetch(`${API}/api/auth/update-credentials`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (r.ok) {
        showMsg('저장되었습니다. 다시 로그인해주세요.', 'success');
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        document.getElementById('currentPassword').value = '';
        setTimeout(() => authLogout(), 1500);
      } else {
        const err = await r.json();
        showMsg(err.detail || '오류가 발생했습니다.', 'error');
      }
    } catch {
      showMsg('서버 연결 오류가 발생했습니다.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '저장';
    }
  }

  loadUsername();
</script>
