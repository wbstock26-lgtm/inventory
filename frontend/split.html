<!DOCTYPE html>
<title>재고 Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg:#f0f2f5; --surface:#fff; --surface2:#f7f8fa; --border:#e4e7ec;
  --fg:#111827; --fg2:#6b7280; --fg3:#9ca3af;
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-bg:#eff6ff;
  --green:#16a34a; --green-bg:#f0fdf4;
  --red:#dc2626; --red-bg:#fef2f2;
  --orange:#ea580c; --orange-bg:#fff7ed;
  --purple:#7c3aed; --purple-bg:#f5f3ff;
  --shadow:0 1px 3px rgba(0,0,0,.08); --radius:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1117; --surface:#1a1d24; --surface2:#1f2330; --border:#2a2f3d;
    --fg:#f1f3f9; --fg2:#8b90a0; --fg3:#4a5270;
    --accent:#3b82f6; --accent-bg:#1e2a4a;
    --green:#4ade80; --green-bg:#0a2010;
    --red:#f87171; --red-bg:#2a0808;
    --orange:#fb923c; --orange-bg:#1f0d00;
    --purple:#a78bfa; --purple-bg:#1a1040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d24; --surface2:#1f2330; --border:#2a2f3d;
  --fg:#f1f3f9; --fg2:#8b90a0; --fg3:#4a5270;
  --accent:#3b82f6; --accent-bg:#1e2a4a;
  --green:#4ade80; --green-bg:#0a2010;
  --red:#f87171; --red-bg:#2a0808;
  --orange:#fb923c; --orange-bg:#1f0d00;
  --purple:#a78bfa; --purple-bg:#1a1040;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; font-size: 13px; background: var(--bg); color: var(--fg);
  padding-left: max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px)); }
a { color: inherit; text-decoration: none; }

/* ── Topbar ── */
.topbar { background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px;
  height: 50px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; margin-right: 16px; }
.brand-icon { width: 30px; height: 30px; border-radius: 7px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.nav-links { display: flex; gap: 2px; }
.nav-link { padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--fg2); white-space: nowrap; }
.nav-link:hover { background: var(--bg); color: var(--fg); }
.nav-link.active { background: var(--accent-bg); color: var(--accent); }

/* ── Layout ── */
.main { max-width: 1160px; margin: 0 auto; padding: 28px 0 48px; display: flex; gap: 16px; align-items: flex-start; }
.left-col { flex: 1 1 0; min-width: 0; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.page-header p { color: var(--fg2); font-size: 12px; margin-top: 4px; }

/* ── Right Panel ── */
.right-panel { width: 270px; flex-shrink: 0; position: sticky; top: 66px; }
.panel-header { font-size: 11px; font-weight: 700; color: var(--fg2); text-transform: uppercase;
  letter-spacing: .06em; padding: 10px 12px 8px; border-bottom: 1px solid var(--border); }
.panel-search { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.panel-search input { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 12px; font-family: inherit; background: var(--surface2); color: var(--fg); }
.panel-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.panel-list { max-height: calc(100vh - 180px); overflow-y: auto; }
.panel-item { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between;
  align-items: center; gap: 8px; border-bottom: 1px solid var(--border); transition: background .1s; }
.panel-item:last-child { border-bottom: none; }
.panel-item:hover { background: var(--accent-bg); }
.panel-item:hover .panel-item-push { opacity: 1; }
.panel-item-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; flex: 1; min-width: 0; }
.panel-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.panel-item-stock { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--fg2); }
.panel-item-stock.neg { color: var(--red); }
.panel-item-push { font-size: 10px; color: var(--accent); font-weight: 700; opacity: 0; transition: opacity .1s; }
@media (max-width: 860px) { .main { flex-direction: column; } .right-panel { width: 100%; position: static; } .panel-list { max-height: 220px; } }

/* ── Card ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-title { font-size: 12px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }

/* ── Form ── */
label { font-size: 11px; font-weight: 600; color: var(--fg2); display: block; margin-bottom: 4px; }
.input, .select-input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; font-family: inherit; background: var(--surface); color: var(--fg);
}
.input:focus, .select-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 540px) { .form-row { grid-template-columns: 1fr; } }

/* ── Search dropdown ── */
.search-wrap { position: relative; }
.search-drop { position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); max-height: 220px; overflow-y: auto; margin-top: 2px; }
.drop-item { padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drop-item:hover { background: var(--surface2); }
.drop-item-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop-item-meta { font-size: 11px; color: var(--fg2); font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
.stock-neg { color: var(--red); }

/* ── Rule badge ── */
.rule-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 8px; }
.rule-24 { background: var(--accent-bg); color: var(--accent); }
.rule-12 { background: var(--orange-bg); color: var(--orange); }
.rule-none { background: var(--surface2); color: var(--fg3); }

/* ── Preview box ── */
.preview { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-top: 4px; }
.preview-row { display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.preview-row:last-child { border-bottom: none; }
.preview-label { color: var(--fg2); font-size: 12px; }
.preview-val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.diff-neg { color: var(--red); }
.diff-pos { color: var(--green); }

/* ── Submit ── */
.submit-btn { width: 100%; padding: 11px; border: none; border-radius: 7px;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 14px; transition: background .15s; }
.submit-btn:hover { background: var(--accent-h); }
.submit-btn:disabled { background: var(--border); color: var(--fg3); cursor: not-allowed; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; z-index: 999;
  padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); animation: slideUp .2s ease; }
.toast-ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
.toast-err { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red); }
@keyframes slideUp { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }

/* ── History table ── */
.hist-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { padding: 7px 10px; font-size: 10px; font-weight: 700; color: var(--fg3);
  letter-spacing: .05em; text-transform: uppercase; border-bottom: 2px solid var(--border); text-align: left; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
</style>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">📦</div>
    Inventory
  </div>
  <div class="nav-links">
    <a class="nav-link" href="/">🏠 홈</a>
    <a class="nav-link" href="/inventory.html">📦 재고 현황</a>
    <a class="nav-link" href="/import.html">📥 발주 입고</a>
    <a class="nav-link" href="/sales.html">🛒 판매 입력</a>
    <a class="nav-link" href="/prices.html">💰 판매가 관리</a>
    <a class="nav-link active" href="/split.html">✂️ Split</a>
    <a class="nav-link" href="/bulk_import.html">📋 제품 일괄등록</a>
  </div>
</div>

<div class="main">
<div class="left-col">
  <div class="page-header">
    <h1>✂️ 재고 Split</h1>
    <p>24캔 → 8캔×3개 &nbsp;|&nbsp; 12캔 → 6캔×2개로 분할하여 재고에 반영합니다.</p>
  </div>

  <!-- Split 입력 -->
  <div class="card">
    <div class="card-title">분할 설정</div>

    <div class="form-row">
      <div>
        <label>원본 제품 (분할할 대상)</label>
        <div class="search-wrap">
          <input class="input" id="srcInput" placeholder="제품명 또는 UPC 검색…" autocomplete="off"
            oninput="searchProduct('src', this.value)" onfocus="searchProduct('src', this.value)">
          <div class="search-drop" id="srcDrop" style="display:none"></div>
        </div>
        <div id="srcRule"></div>
      </div>
      <div>
        <label>분할 후 제품 (증가할 대상)</label>
        <div class="search-wrap">
          <input class="input" id="dstInput" placeholder="제품명 또는 UPC 검색…" autocomplete="off"
            oninput="searchProduct('dst', this.value)" onfocus="searchProduct('dst', this.value)">
          <div class="search-drop" id="dstDrop" style="display:none"></div>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label>분할 수량 (원본 단위)</label>
        <input class="input" id="qtyInput" type="number" min="1" value="1" oninput="updatePreview()">
      </div>
      <div>
        <label>메모 (선택)</label>
        <input class="input" id="noteInput" placeholder="Split 메모…">
      </div>
    </div>

    <!-- Preview -->
    <div id="previewWrap" style="display:none">
      <div class="card-title" style="margin-bottom:8px">변경 미리보기</div>
      <div class="preview">
        <div class="preview-row">
          <span class="preview-label" id="prevSrcName">원본 제품</span>
          <span>
            <span class="preview-val mono" id="prevSrcBefore">—</span>
            <span style="color:var(--fg3);margin:0 4px">→</span>
            <span class="preview-val mono diff-neg" id="prevSrcAfter">—</span>
            <span class="preview-label" style="margin-left:4px" id="prevSrcDiff"></span>
          </span>
        </div>
        <div class="preview-row">
          <span class="preview-label" id="prevDstName">분할 제품</span>
          <span>
            <span class="preview-val mono" id="prevDstBefore">—</span>
            <span style="color:var(--fg3);margin:0 4px">→</span>
            <span class="preview-val mono diff-pos" id="prevDstAfter">—</span>
            <span class="preview-label" style="margin-left:4px" id="prevDstDiff"></span>
          </span>
        </div>
        <div class="preview-row">
          <span class="preview-label">분할 비율</span>
          <span class="preview-val mono" id="prevRatio">—</span>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" disabled onclick="doSplit()">✂️ Split 실행</button>
  </div>

  <!-- 최근 Split 이력 -->
  <div class="card">
    <div class="card-title">최근 Split 이력</div>
    <div class="hist-wrap">
      <table>
        <thead>
          <tr>
            <th>일시</th>
            <th>원본 제품</th>
            <th>분할 제품</th>
            <th>-수량</th>
            <th>+수량</th>
          </tr>
        </thead>
        <tbody id="histBody">
          <tr><td colspan="5" style="text-align:center;color:var(--fg3);padding:20px">로딩 중…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div><!-- /left-col -->

<!-- 오른쪽: 24캔 제품 목록 -->
<div class="card right-panel" style="padding:0;overflow:hidden;">
  <div class="panel-header">📦 24캔 제품 목록</div>
  <div class="panel-search">
    <input id="panelSearch" placeholder="제품명 검색…" oninput="filterPanel(this.value)" autocomplete="off">
  </div>
  <div class="panel-list" id="panelList">
    <div style="padding:20px;text-align:center;color:var(--fg3)">로딩 중…</div>
  </div>
</div>

</div><!-- /main -->

<script>
const API = '';

let _products = [];
let srcProduct = null;
let dstProduct = null;

let _24canProducts = [];

// 제품 목록 로드
async function loadProducts() {
  const r = await fetch(`${API}/api/products?limit=2000`);
  _products = await r.json();
  _24canProducts = _products.filter(p => /24[x×xX]/i.test(p.name) && p.is_active !== false);
  _24canProducts.sort((a, b) => a.name.localeCompare(b.name));
  renderPanel(_24canProducts);
}

function renderPanel(list) {
  const el = document.getElementById('panelList');
  if (!list.length) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--fg3)">해당 제품 없음</div>';
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="panel-item" onclick="selectFromPanel(${p.id})">
      <span class="panel-item-name" title="${p.name}">${p.name}</span>
      <span class="panel-item-right">
        <span class="panel-item-stock${p.stock < 0 ? ' neg' : ''}">재고 ${p.stock}</span>
        <span class="panel-item-push">▶</span>
      </span>
    </div>`).join('');
}

function filterPanel(q) {
  const val = q.trim().toLowerCase();
  if (!val) { renderPanel(_24canProducts); return; }
  const terms = val.split(/\s+/).filter(Boolean);
  renderPanel(_24canProducts.filter(p => {
    const nm = p.name.toLowerCase();
    return terms.every(t => nm.includes(t));
  }));
}

function selectFromPanel(id) {
  selectProduct('src', id);
  // 패널에서 선택 시 src 입력칸에 포커스 이동
  document.getElementById('srcInput').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// 제품 검색
function searchProduct(side, q) {
  const drop = document.getElementById(side + 'Drop');
  const val = q.trim().toLowerCase();
  if (!val) { drop.style.display = 'none'; return; }

  const terms = val.split(/\s+/).filter(Boolean);
  const hits = _products.filter(p => {
    const nm = (p.name || '').toLowerCase();
    const bc = p.barcode || '';
    return (bc.includes(val)) || terms.every(t => nm.includes(t));
  }).slice(0, 12);

  if (!hits.length) { drop.style.display = 'none'; return; }

  drop.innerHTML = hits.map(p => `
    <div class="drop-item" onclick="selectProduct('${side}', ${p.id})">
      <span class="drop-item-name">${p.name}</span>
      <span class="drop-item-meta ${p.stock < 0 ? 'stock-neg' : ''}">재고 ${p.stock}</span>
    </div>`).join('');
  drop.style.display = '';
}

function selectProduct(side, id) {
  const p = _products.find(x => x.id === id);
  if (!p) return;
  document.getElementById(side + 'Input').value = p.name;
  document.getElementById(side + 'Drop').style.display = 'none';

  if (side === 'src') {
    srcProduct = p;
    // 분할 규칙 배지
    const rule = detectRule(p.name);
    const ruleEl = document.getElementById('srcRule');
    if (rule.pack === 24) {
      ruleEl.innerHTML = `<span class="rule-badge rule-24">✂️ 24캔 → 8캔 × 3개</span>`;
    } else if (rule.pack === 12) {
      ruleEl.innerHTML = `<span class="rule-badge rule-12">✂️ 12캔 → 6캔 × 2개</span>`;
    } else {
      ruleEl.innerHTML = `<span class="rule-badge rule-none">분할 규칙 미감지 (1:1)</span>`;
    }
  } else {
    dstProduct = p;
  }
  updatePreview();
}

function detectRule(name) {
  const m = name.match(/(\d+)[x×xX]/i);
  const pack = m ? parseInt(m[1]) : 0;
  if (pack === 24) return { pack: 24, ratio: 3 };
  if (pack === 12) return { pack: 12, ratio: 2 };
  return { pack, ratio: 1 };
}

function updatePreview() {
  const qty = parseInt(document.getElementById('qtyInput').value) || 0;
  const wrap = document.getElementById('previewWrap');
  const btn  = document.getElementById('submitBtn');

  if (!srcProduct || !dstProduct || qty <= 0) {
    wrap.style.display = 'none';
    btn.disabled = true;
    return;
  }

  const rule = detectRule(srcProduct.name);
  const added = qty * rule.ratio;

  document.getElementById('prevSrcName').textContent  = srcProduct.name;
  document.getElementById('prevDstName').textContent  = dstProduct.name;
  document.getElementById('prevSrcBefore').textContent = srcProduct.stock;
  document.getElementById('prevDstBefore').textContent = dstProduct.stock;
  document.getElementById('prevSrcAfter').textContent  = srcProduct.stock - qty;
  document.getElementById('prevDstAfter').textContent  = dstProduct.stock + added;
  document.getElementById('prevSrcDiff').textContent   = `(-${qty})`;
  document.getElementById('prevDstDiff').textContent   = `(+${added})`;
  document.getElementById('prevRatio').textContent =
    `1개 분할 → ${rule.ratio}개 증가 (${rule.pack || '?'}캔 기준)`;

  wrap.style.display = '';
  btn.disabled = false;
}

async function doSplit() {
  const qty  = parseInt(document.getElementById('qtyInput').value) || 0;
  const note = document.getElementById('noteInput').value.trim();
  if (!srcProduct || !dstProduct || qty <= 0) return;

  document.getElementById('submitBtn').disabled = true;
  try {
    const r = await fetch(`${API}/api/stock/split`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from_product_id: srcProduct.id,
        to_product_id:   dstProduct.id,
        qty,
        note: note || null,
      }),
    });
    if (!r.ok) {
      const e = await r.json();
      throw new Error(e.detail || '오류');
    }
    const res = await r.json();
    showToast(`✅ Split 완료: ${res.from_product} -${res.qty_removed} / ${res.to_product} +${res.qty_added}`, 'ok');

    // 재고 업데이트
    srcProduct.stock = res.from_stock_after;
    dstProduct.stock = res.to_stock_after;
    // _products 갱신
    const sp = _products.find(x => x.id === srcProduct.id);
    const dp = _products.find(x => x.id === dstProduct.id);
    if (sp) sp.stock = res.from_stock_after;
    if (dp) dp.stock = res.to_stock_after;

    updatePreview();
    loadHistory();
    // 패널 재고 갱신
    filterPanel(document.getElementById('panelSearch').value);
  } catch(e) {
    showToast('❌ ' + e.message, 'err');
  }
  document.getElementById('submitBtn').disabled = false;
}

async function loadHistory() {
  try {
    // adj 타입 중 split 메모가 있는 것 조회
    const r = await fetch(`${API}/api/stock/movements?type=adj&limit=200`);
    const data = await r.json();
    const splits = data.filter(m => m.note && (m.note.includes('Split') || m.note.includes('split')));
    // 날짜 내림차순으로 최근 20개
    const recent = splits.slice(0, 20);
    const tbody = document.getElementById('histBody');
    if (!recent.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--fg3);padding:20px">이력 없음</td></tr>';
      return;
    }
    // 쌍 매칭: 같은 시간대 adj 쌍
    tbody.innerHTML = recent.map(m => {
      const dt = (m.created_at || '').replace('T', ' ').slice(0, 16);
      const qty = m.quantity;
      return `<tr>
        <td class="mono" style="font-size:11px">${dt}</td>
        <td style="font-size:12px">${m.product_name || ''}</td>
        <td style="color:var(--fg3);font-size:11px">${m.note || ''}</td>
        <td class="mono ${qty < 0 ? 'diff-neg' : 'diff-pos'}">${qty > 0 ? '+' : ''}${qty}</td>
        <td></td>
      </tr>`;
    }).join('');
  } catch {}
}

function showToast(msg, type) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// 외부 클릭 시 드롭다운 닫기
document.addEventListener('click', e => {
  ['src','dst'].forEach(s => {
    if (!document.getElementById(s+'Input').contains(e.target) &&
        !document.getElementById(s+'Drop').contains(e.target)) {
      document.getElementById(s+'Drop').style.display = 'none';
    }
  });
});

loadProducts().then(loadHistory);
</script>
