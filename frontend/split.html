<!DOCTYPE html>
<title>재고 Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="/auth.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg:#f0f2f5; --surface:#fff; --surface2:#f7f8fa; --border:#e4e7ec;
  --fg:#111827; --fg2:#6b7280; --fg3:#9ca3af;
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-bg:#eff6ff;
  --green:#16a34a; --green-bg:#f0fdf4;
  --red:#dc2626; --red-bg:#fef2f2;
  --orange:#ea580c; --orange-bg:#fff7ed;
  --purple:#7c3aed; --purple-bg:#f5f3ff;
  --shadow:0 1px 3px rgba(0,0,0,.08); --radius:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1117; --surface:#1a1d24; --surface2:#1f2330; --border:#2a2f3d;
    --fg:#f1f3f9; --fg2:#8b90a0; --fg3:#4a5270;
    --accent:#3b82f6; --accent-bg:#1e2a4a;
    --green:#4ade80; --green-bg:#0a2010;
    --red:#f87171; --red-bg:#2a0808;
    --orange:#fb923c; --orange-bg:#1f0d00;
    --purple:#a78bfa; --purple-bg:#1a1040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d24; --surface2:#1f2330; --border:#2a2f3d;
  --fg:#f1f3f9; --fg2:#8b90a0; --fg3:#4a5270;
  --accent:#3b82f6; --accent-bg:#1e2a4a;
  --green:#4ade80; --green-bg:#0a2010;
  --red:#f87171; --red-bg:#2a0808;
  --orange:#fb923c; --orange-bg:#1f0d00;
  --purple:#a78bfa; --purple-bg:#1a1040;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; font-size: 13px; background: var(--bg); color: var(--fg);
  padding-left: max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px)); }
a { color: inherit; text-decoration: none; }

/* ── Topbar ── */
.topbar { background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px;
  height: 50px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; margin-right: 16px; }
.brand-icon { width: 30px; height: 30px; border-radius: 7px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.nav-links { display: flex; gap: 2px; }
.nav-link { padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--fg2); white-space: nowrap; }
.nav-link:hover { background: var(--bg); color: var(--fg); }
.nav-link.active { background: var(--accent-bg); color: var(--accent); }

/* ── Layout ── */
.main { max-width: 1160px; margin: 0 auto; padding: 28px 0 48px; display: flex; gap: 16px; align-items: flex-start; }
.left-col { flex: 1 1 0; min-width: 0; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.page-header p { color: var(--fg2); font-size: 12px; margin-top: 4px; }

/* ── Right Panel ── */
.right-panel { width: 270px; flex-shrink: 0; position: sticky; top: 66px; }
.panel-header { font-size: 11px; font-weight: 700; color: var(--fg2); text-transform: uppercase;
  letter-spacing: .06em; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.panel-header-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.panel-hidden-badge { font-size: 10px; color: var(--fg3); font-weight: 400; text-transform: none;
  letter-spacing: 0; white-space: nowrap; }
.panel-hidden-badge a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.panel-add-btn { background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--accent); cursor: pointer; font-size: 14px; font-weight: 700; padding: 1px 7px;
  line-height: 1.6; flex-shrink: 0; }
.panel-add-btn:hover { background: var(--accent-bg); }
.panel-search { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.panel-search input { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 12px; font-family: inherit; background: var(--surface2); color: var(--fg); }
.panel-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.panel-add-search { padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--accent-bg); }
.panel-add-search input { width: 100%; padding: 5px 8px; border: 1px solid var(--accent); border-radius: 5px;
  font-size: 12px; font-family: inherit; background: var(--surface); color: var(--fg); }
.panel-add-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.panel-add-drop { background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
  margin-top: 4px; max-height: 150px; overflow-y: auto; }
.panel-add-drop-item { padding: 7px 8px; cursor: pointer; font-size: 12px; display: flex;
  justify-content: space-between; align-items: center; gap: 6px; }
.panel-add-drop-item:hover { background: var(--accent-bg); }
.panel-list { max-height: calc(100vh - 200px); overflow-y: auto; }
.panel-group { border-bottom: 1px solid var(--border); }
.panel-group:last-child { border-bottom: none; }
.panel-item { padding: 7px 10px 7px 12px; cursor: pointer; display: flex; justify-content: space-between;
  align-items: center; gap: 6px; transition: background .1s; }
.panel-item:hover { background: var(--accent-bg); }
.panel-pair-row { display: flex; align-items: center; gap: 5px; padding: 5px 10px 5px 12px;
  background: var(--surface2); cursor: pointer; font-size: 11px; min-height: 26px;
  position: relative; transition: background .1s; }
.panel-pair-row:hover { background: var(--accent-bg); }
.panel-pair-arrow { color: var(--fg3); flex-shrink: 0; }
.panel-pair-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--fg2); font-weight: 500; }
.panel-pair-stock { font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--fg3); flex-shrink: 0; }
.panel-pair-stock.neg { color: var(--red); }
.panel-pair-add { flex: 1; color: var(--fg3); }
.panel-pair-clear { background: none; border: none; color: var(--fg3); cursor: pointer;
  font-size: 13px; padding: 0 1px; line-height: 1; flex-shrink: 0; }
.panel-pair-clear:hover { color: var(--red); }
.panel-pair-editor-input { flex: 1; padding: 3px 6px; border: 1px solid var(--accent); border-radius: 4px;
  font-size: 11px; font-family: inherit; background: var(--surface); color: var(--fg); min-width: 0; }
.panel-pair-editor-input:focus { outline: none; }
.panel-pair-editor-drop { position: absolute; left: 0; right: 0; top: 100%; z-index: 60;
  background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12); max-height: 160px; overflow-y: auto; margin-top: 1px; }
.panel-item:hover .panel-item-push { opacity: 1; }
.panel-item:hover .panel-item-del { opacity: 1; }
.panel-item-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; flex: 1; min-width: 0; }
.panel-item-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.panel-item-stock { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--fg2); }
.panel-item-stock.neg { color: var(--red); }
.panel-item-push { font-size: 10px; color: var(--accent); font-weight: 700; opacity: 0; transition: opacity .1s; }
.panel-item-del { background: none; border: none; color: var(--fg3); cursor: pointer; font-size: 15px;
  padding: 0 1px; line-height: 1; opacity: 0; transition: opacity .1s, color .1s; }
.panel-item-del:hover { color: var(--red); }

/* ── Ratio edit ── */
.ratio-edit-wrap { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  margin-top: 6px; flex-wrap: wrap; }
.ratio-edit-label { font-size: 11px; color: var(--fg2); }
.ratio-input { width: 56px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 13px; font-family: 'IBM Plex Mono', monospace; text-align: center;
  background: var(--surface); color: var(--fg); }
.ratio-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.ratio-save-btn { padding: 4px 10px; background: var(--accent); color: #fff; border: none;
  border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; }
.ratio-save-btn:hover { background: var(--accent-h); }
.ratio-reset-btn { padding: 4px 8px; background: none; border: 1px solid var(--border);
  border-radius: 5px; font-size: 11px; color: var(--fg2); cursor: pointer; }
.ratio-reset-btn:hover { color: var(--red); border-color: var(--red); }
.rule-custom-tag { font-size: 10px; background: var(--orange-bg); color: var(--orange);
  border-radius: 3px; padding: 1px 5px; font-weight: 600; margin-left: 4px; }

@media (max-width: 860px) { .main { flex-direction: column; } .right-panel { width: 100%; position: static; } .panel-list { max-height: 220px; } }

/* ── Card ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-title { font-size: 12px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }

/* ── Form ── */
label { font-size: 11px; font-weight: 600; color: var(--fg2); display: block; margin-bottom: 4px; }
.input, .select-input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; font-family: inherit; background: var(--surface); color: var(--fg);
}
.input:focus, .select-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 540px) { .form-row { grid-template-columns: 1fr; } }

/* ── Search dropdown ── */
.search-wrap { position: relative; }
.search-drop { position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); max-height: 220px; overflow-y: auto; margin-top: 2px; }
.drop-item { padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drop-item:hover { background: var(--surface2); }
.drop-item-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop-item-meta { font-size: 11px; color: var(--fg2); font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
.stock-neg { color: var(--red); }

/* ── Rule badge ── */
.rule-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 8px; }
.rule-24 { background: var(--accent-bg); color: var(--accent); }
.rule-12 { background: var(--orange-bg); color: var(--orange); }
.rule-none { background: var(--surface2); color: var(--fg3); }

/* ── Preview box ── */
.preview { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-top: 4px; }
.preview-row { display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.preview-row:last-child { border-bottom: none; }
.preview-label { color: var(--fg2); font-size: 12px; }
.preview-val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.diff-neg { color: var(--red); }
.diff-pos { color: var(--green); }

/* ── Submit ── */
.submit-btn { width: 100%; padding: 11px; border: none; border-radius: 7px;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 14px; transition: background .15s; }
.submit-btn:hover { background: var(--accent-h); }
.submit-btn:disabled { background: var(--border); color: var(--fg3); cursor: not-allowed; }

/* ── Context menu ── */
#spl-ctx-menu {
  position: fixed; z-index: 9999; display: none;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  overflow: hidden; min-width: 180px;
}
#spl-ctx-menu button {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 10px 16px; border: none; background: none;
  color: var(--fg); font-size: 13px; font-weight: 500; cursor: pointer;
  text-align: left; white-space: nowrap;
}
#spl-ctx-menu button:hover { background: var(--accent-bg); color: var(--accent); }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; z-index: 999;
  padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); animation: slideUp .2s ease; }
.toast-ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
.toast-err { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red); }
@keyframes slideUp { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }

/* ── History table ── */
.hist-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { padding: 7px 10px; font-size: 10px; font-weight: 700; color: var(--fg3);
  letter-spacing: .05em; text-transform: uppercase; border-bottom: 2px solid var(--border); text-align: left; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
.mono { font-family: 'IBM Plex Mono', monospace; }
</style>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">📦</div>
    Inventory
  </div>
  <div class="nav-links">
    <a class="nav-link" href="/">🏠 홈</a>
    <a class="nav-link" href="/inventory.html">📦 재고 현황</a>
    <a class="nav-link" href="/import.html">📥 발주 입고</a>
    <a class="nav-link" href="/sales.html">🛒 판매 입력</a>
    <a class="nav-link" href="/prices.html">💰 판매가 관리</a>
    <a class="nav-link active" href="/split.html">✂️ Split</a>
    <a class="nav-link" href="/bulk_import.html">📋 제품 일괄등록</a>
  </div>
  <button onclick="authLogout()" style="margin-left:auto;font-size:12px;font-weight:600;color:var(--fg2);background:none;border:1.5px solid var(--border);padding:4px 11px;border-radius:6px;cursor:pointer;white-space:nowrap" onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='';this.style.borderColor=''">로그아웃</button>
</div>

<div class="main">
<div class="left-col">
  <div class="page-header">
    <h1>✂️ 재고 Split</h1>
    <p>24캔 → 8캔×3개 &nbsp;|&nbsp; 12캔 → 6캔×2개로 분할하여 재고에 반영합니다.</p>
  </div>

  <!-- Split 입력 -->
  <div class="card">
    <div class="card-title">분할 설정</div>

    <div class="form-row">
      <div>
        <label>원본 제품 (분할할 대상)</label>
        <div class="search-wrap">
          <input class="input" id="srcInput" placeholder="제품명 또는 UPC 검색…" autocomplete="off"
            oninput="searchProduct('src', this.value)" onfocus="searchProduct('src', this.value)">
          <div class="search-drop" id="srcDrop" style="display:none"></div>
        </div>
        <div id="srcRule"></div>
        <div class="ratio-edit-wrap" id="ratioEditWrap" style="display:none">
          <span class="ratio-edit-label">원본 1개 →</span>
          <input class="ratio-input" id="ratioInput" type="number" min="1" max="99" value="1" oninput="updatePreview()">
          <span class="ratio-edit-label">개로 분할</span>
          <button class="ratio-save-btn" onclick="saveCustomRatio()">저장</button>
          <button class="ratio-reset-btn" onclick="clearCustomRatio()">초기화</button>
        </div>
      </div>
      <div>
        <label>분할 후 제품 (증가할 대상)</label>
        <div class="search-wrap">
          <input class="input" id="dstInput" placeholder="제품명 또는 UPC 검색…" autocomplete="off"
            oninput="searchProduct('dst', this.value)" onfocus="searchProduct('dst', this.value)">
          <div class="search-drop" id="dstDrop" style="display:none"></div>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label>분할 수량 (원본 단위)</label>
        <input class="input" id="qtyInput" type="number" min="1" value="1" oninput="updatePreview()">
      </div>
      <div>
        <label>메모 (선택)</label>
        <input class="input" id="noteInput" placeholder="Split 메모…">
      </div>
    </div>

    <!-- Preview -->
    <div id="previewWrap" style="display:none">
      <div class="card-title" style="margin-bottom:8px">변경 미리보기</div>
      <div class="preview">
        <div class="preview-row">
          <span class="preview-label" id="prevSrcName">원본 제품</span>
          <span>
            <span class="preview-val mono" id="prevSrcBefore">—</span>
            <span style="color:var(--fg3);margin:0 4px">→</span>
            <span class="preview-val mono diff-neg" id="prevSrcAfter">—</span>
            <span class="preview-label" style="margin-left:4px" id="prevSrcDiff"></span>
          </span>
        </div>
        <div class="preview-row">
          <span class="preview-label" id="prevDstName">분할 제품</span>
          <span>
            <span class="preview-val mono" id="prevDstBefore">—</span>
            <span style="color:var(--fg3);margin:0 4px">→</span>
            <span class="preview-val mono diff-pos" id="prevDstAfter">—</span>
            <span class="preview-label" style="margin-left:4px" id="prevDstDiff"></span>
          </span>
        </div>
        <div class="preview-row">
          <span class="preview-label">분할 비율</span>
          <span class="preview-val mono" id="prevRatio">—</span>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" disabled onclick="doSplit()">✂️ Split 실행</button>
  </div>

  <!-- 최근 Split 이력 -->
  <div class="card">
    <div class="card-title">최근 Split 이력</div>
    <div class="hist-wrap">
      <table>
        <thead>
          <tr>
            <th>일시</th>
            <th>원본 제품</th>
            <th>분할 제품</th>
            <th style="text-align:center">차감/추가</th>
            <th style="text-align:center">삭제</th>
          </tr>
        </thead>
        <tbody id="histBody">
          <tr><td colspan="5" style="text-align:center;color:var(--fg3);padding:20px">로딩 중…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div><!-- /left-col -->

<!-- 오른쪽: 24캔 제품 목록 -->
<div class="card right-panel" style="padding:0;overflow:hidden;">
  <div class="panel-header">
    <div class="panel-header-left">
      <span>✂️ 24/12캔 목록</span>
      <span class="panel-hidden-badge" id="hiddenBadge"></span>
    </div>
    <button class="panel-add-btn" onclick="toggleAddSearch()" title="제품 추가">＋</button>
  </div>
  <div class="panel-add-search" id="addSearchWrap" style="display:none">
    <input id="addSearchInput" placeholder="추가할 제품 검색…" oninput="searchForAdd(this.value)" autocomplete="off">
    <div class="panel-add-drop" id="addSearchDrop" style="display:none"></div>
  </div>
  <div class="panel-search">
    <input id="panelSearch" placeholder="제품명 검색…" oninput="filterPanel(this.value)" autocomplete="off">
  </div>
  <div class="panel-list" id="panelList">
    <div style="padding:20px;text-align:center;color:var(--fg3)">로딩 중…</div>
  </div>
</div>

</div><!-- /main -->
<div id="spl-ctx-menu">
  <button onclick="splCtxCopyRow()">📋 제품 전체 복사</button>
  <button onclick="splCtxCopyBarcode()">🔢 바코드 복사</button>
  <button onclick="splCtxCopyName()">📝 제품명 복사</button>
</div>

<script>
const API = '';
const bc = new BroadcastChannel('inventory-update');

let _products = [];
let srcProduct = null;
let dstProduct = null;
let _24canProducts = [];
let _currentFilter = '';
let _editingPairId = null;

// ── localStorage helpers ──────────────────────────────────────────
function lsGet(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let _hidden  = new Set(lsGet('split_hidden',  []));
let _custom  = new Set(lsGet('split_custom',  []));
let _ratios  = lsGet('split_ratios', {});
let _pairs   = lsGet('split_pairs',  {});
let _24k     = new Set(lsGet('split_24k', []));
let _12k     = new Set(lsGet('split_12k', []));

function saveHidden()  { lsSet('split_hidden',  [..._hidden]); }
function saveCustom()  { lsSet('split_custom',  [..._custom]); }
function saveRatios()  { lsSet('split_ratios',  _ratios); }
function savePairs()   { lsSet('split_pairs',   _pairs); }

// ── 제품 목록 로드 ───────────────────────────────────────────────
async function loadProducts() {
  const r = await fetch(`${API}/api/products?limit=2000`);
  _products = await r.json();
  rebuildPanel();
}

function getCanSize(name) {
  if (/(^|[^0-9])24([^0-9]|$)/.test(name)) return 24;
  if (/(^|[^0-9])12([^0-9]|$)/.test(name)) return 12;
  return 0;
}

function rebuildPanel() {
  _24k = new Set(lsGet('split_24k', []));
  _12k = new Set(lsGet('split_12k', []));
  _24canProducts = _products.filter(p => (_24k.has(p.id) || _12k.has(p.id) || _custom.has(p.id)) && !_hidden.has(p.id));
  _24canProducts.sort((a, b) => a.name.localeCompare(b.name));
  updateHiddenBadge();
  filterPanel(document.getElementById('panelSearch').value);
}

function updateHiddenBadge() {
  const el = document.getElementById('hiddenBadge');
  if (_hidden.size === 0) { el.textContent = ''; return; }
  el.innerHTML = `숨김 ${_hidden.size}개 · <a onclick="clearHidden()">해제</a>`;
}

function renderPanel(list) {
  const el = document.getElementById('panelList');
  if (!list.length) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--fg3)">해당 제품 없음</div>';
    return;
  }
  el.innerHTML = list.map(p => {
    const isCustom  = _custom.has(p.id);
    const pairId    = _pairs[p.id];
    const pairProd  = pairId ? _products.find(x => x.id === pairId) : null;
    const isEditing = _editingPairId === p.id;

    let pairInner;
    if (isEditing) {
      pairInner = `
        <span class="panel-pair-arrow">→</span>
        <div style="flex:1;position:relative">
          <input class="panel-pair-editor-input" id="pair-input-${p.id}"
            placeholder="분할 제품 검색…"
            oninput="searchPairPartner(this.value, ${p.id})"
            onclick="event.stopPropagation()"
            autocomplete="off">
          <div class="panel-pair-editor-drop" id="pair-drop-${p.id}" style="display:none"></div>
        </div>`;
    } else if (pairProd) {
      pairInner = `
        <span class="panel-pair-arrow">→</span>
        <span class="panel-pair-name" title="${pairProd.name}">${pairProd.name}</span>
        <span class="panel-pair-stock${pairProd.stock < 0 ? ' neg' : ''}">재고 ${pairProd.stock}</span>
        <button class="panel-pair-clear" onclick="event.stopPropagation();clearPair(${p.id})" title="연결 해제">×</button>`;
    } else {
      pairInner = `
        <span class="panel-pair-arrow">→</span>
        <span class="panel-pair-add">+ 분할 제품 연결</span>`;
    }

    return `
    <div class="panel-group" id="pg-${p.id}">
      <div class="panel-item" onclick="selectPairSource(${p.id})">
        <span class="panel-item-name" title="${p.name}">${p.name}${isCustom ? '<span class="rule-custom-tag">추가</span>' : ''}</span>
        <span class="panel-item-right">
          <span class="panel-item-stock${p.stock < 0 ? ' neg' : ''}">재고 ${p.stock}</span>
          <span class="panel-item-push">▶</span>
          <button class="panel-item-del" onclick="event.stopPropagation();removeFromPanel(${p.id})" title="목록에서 숨기기">×</button>
        </span>
      </div>
      <div class="panel-pair-row" id="prow-${p.id}" onclick="event.stopPropagation();clickPairRow(${p.id})">
        ${pairInner}
      </div>
    </div>`;
  }).join('');

  if (_editingPairId !== null) {
    const inp = document.getElementById(`pair-input-${_editingPairId}`);
    if (inp) setTimeout(() => inp.focus(), 50);
  }
}

function filterPanel(q) {
  _currentFilter = q || '';
  const val = _currentFilter.trim().toLowerCase();
  if (!val) { renderPanel(_24canProducts); return; }
  const terms = val.split(/\s+/).filter(Boolean);
  renderPanel(_24canProducts.filter(p => {
    const nm = p.name.toLowerCase();
    return terms.every(t => nm.includes(t));
  }));
}

function refreshPanel() { filterPanel(_currentFilter); }

// ── 패널 추가 / 숨기기 ──────────────────────────────────────────
function removeFromPanel(id) {
  _hidden.add(id); _custom.delete(id);
  saveHidden(); saveCustom();
  rebuildPanel();
}

function clearHidden() {
  _hidden.clear();
  saveHidden();
  rebuildPanel();
}

let _addOpen = false;
function toggleAddSearch() {
  _addOpen = !_addOpen;
  document.getElementById('addSearchWrap').style.display = _addOpen ? '' : 'none';
  if (_addOpen) document.getElementById('addSearchInput').focus();
  else { document.getElementById('addSearchInput').value = ''; document.getElementById('addSearchDrop').style.display = 'none'; }
}

function searchForAdd(q) {
  const val = q.trim().toLowerCase();
  const drop = document.getElementById('addSearchDrop');
  if (!val) { drop.style.display = 'none'; return; }
  const terms = val.split(/\s+/).filter(Boolean);
  const panelIds = new Set(_24canProducts.map(p => p.id));
  const hits = _products.filter(p => {
    if (panelIds.has(p.id)) return false;
    const nm = (p.name || '').toLowerCase();
    return terms.every(t => nm.includes(t));
  }).slice(0, 10);
  if (!hits.length) { drop.style.display = 'none'; return; }
  drop.innerHTML = hits.map(p => `
    <div class="panel-add-drop-item" onclick="addToPanel(${p.id})">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${p.name}</span>
      <span style="font-size:11px;color:var(--fg2);flex-shrink:0">재고 ${p.stock}</span>
    </div>`).join('');
  drop.style.display = '';
}

function addToPanel(id) {
  _hidden.delete(id); _custom.add(id);
  saveHidden(); saveCustom();
  document.getElementById('addSearchInput').value = '';
  document.getElementById('addSearchDrop').style.display = 'none';
  toggleAddSearch();
  rebuildPanel();
  showToast('✅ 패널에 추가됐습니다', 'ok');
}

// ── 페어 선택 / 편집 ────────────────────────────────────────────
function selectPairSource(id) {
  selectProduct('src', id);
  const pairId = _pairs[id];
  if (pairId) selectProduct('dst', pairId);
  document.getElementById('srcInput').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function clickPairRow(id) {
  if (_editingPairId === id) return;
  const pairId = _pairs[id];
  if (pairId) { selectPairSource(id); return; }
  _editingPairId = id;
  refreshPanel();
}

function searchPairPartner(q, fromId) {
  const drop = document.getElementById(`pair-drop-${fromId}`);
  const val = q.trim().toLowerCase();
  if (!val) { drop.style.display = 'none'; return; }
  const terms = val.split(/\s+/).filter(Boolean);
  const hits = _products.filter(p => {
    if (p.id === fromId) return false;
    const nm = (p.name || '').toLowerCase();
    return terms.every(t => nm.includes(t));
  }).slice(0, 8);
  if (!hits.length) { drop.style.display = 'none'; return; }
  drop.innerHTML = hits.map(p => `
    <div class="panel-add-drop-item" onclick="event.stopPropagation();confirmPairPartner(${fromId}, ${p.id})">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${p.name}</span>
      <span style="font-size:11px;color:var(--fg2);flex-shrink:0">재고 ${p.stock}</span>
    </div>`).join('');
  drop.style.display = '';
}

function confirmPairPartner(fromId, toId) {
  _pairs[fromId] = toId;
  savePairs();
  _editingPairId = null;
  refreshPanel();
  selectProduct('src', fromId);
  selectProduct('dst', toId);
  showToast('✅ 분할 제품이 연결됐습니다', 'ok');
}

function clearPair(fromId) {
  delete _pairs[fromId];
  savePairs();
  refreshPanel();
}

// ── 제품 검색 / 선택 ────────────────────────────────────────────
function searchProduct(side, q) {
  const drop = document.getElementById(side + 'Drop');
  const val = q.trim().toLowerCase();
  if (!val) { drop.style.display = 'none'; return; }
  const terms = val.split(/\s+/).filter(Boolean);
  const hits = _products.filter(p => {
    const nm = (p.name || '').toLowerCase();
    const bc = p.barcode || '';
    return bc.includes(val) || terms.every(t => nm.includes(t));
  }).slice(0, 12);
  if (!hits.length) { drop.style.display = 'none'; return; }
  drop.innerHTML = hits.map(p => `
    <div class="drop-item" onclick="selectProduct('${side}', ${p.id})">
      <span class="drop-item-name">${p.name}</span>
      <span class="drop-item-meta ${p.stock < 0 ? 'stock-neg' : ''}">재고 ${p.stock}</span>
    </div>`).join('');
  drop.style.display = '';
}

function selectProduct(side, id) {
  const p = _products.find(x => x.id === id);
  if (!p) return;
  document.getElementById(side + 'Input').value = p.name;
  document.getElementById(side + 'Drop').style.display = 'none';
  if (side === 'src') { srcProduct = p; updateRuleUI(p); }
  else { dstProduct = p; }
  updatePreview();
}

// ── 분할 규칙 / 비율 UI ─────────────────────────────────────────
function detectRule(name) {
  const m = name.match(/(\d+)[x×xX]/i);
  const pack = m ? parseInt(m[1]) : 0;
  if (pack === 24) return { pack: 24, ratio: 3 };
  if (pack === 12) return { pack: 12, ratio: 2 };
  return { pack, ratio: 1 };
}

function getEffectiveRatio(id, name) {
  if (_ratios[id] != null) return _ratios[id];
  const rule = detectRule(name);
  if (rule.ratio !== 1) return rule.ratio;
  if (_24k.has(id)) return 3;
  if (_12k.has(id)) return 2;
  return 1;
}

function updateRuleUI(p) {
  const ratio = getEffectiveRatio(p.id, p.name);
  const autoRule = detectRule(p.name);
  const isCustomRatio = _ratios[p.id] != null;
  const ruleEl = document.getElementById('srcRule');

  const effPack = autoRule.pack || (_24k.has(p.id) ? 24 : _12k.has(p.id) ? 12 : 0);
  let badgeHtml;
  if (effPack === 24) {
    badgeHtml = `<span class="rule-badge rule-24">✂️ 24캔 → 8캔 × ${ratio}개${isCustomRatio ? '<span class="rule-custom-tag">수정됨</span>' : ''}</span>`;
  } else if (effPack === 12) {
    badgeHtml = `<span class="rule-badge rule-12">✂️ 12캔 → 6캔 × ${ratio}개${isCustomRatio ? '<span class="rule-custom-tag">수정됨</span>' : ''}</span>`;
  } else {
    badgeHtml = `<span class="rule-badge rule-none">분할 규칙 미감지${isCustomRatio ? '' : ' (1:1)'} ${isCustomRatio ? '→ 1개당 ' + ratio + '개<span class="rule-custom-tag">수정됨</span>' : ''}</span>`;
  }
  ruleEl.innerHTML = badgeHtml;

  const wrap = document.getElementById('ratioEditWrap');
  wrap.style.display = '';
  document.getElementById('ratioInput').value = ratio;
}

function saveCustomRatio() {
  if (!srcProduct) return;
  const v = parseInt(document.getElementById('ratioInput').value);
  if (!v || v < 1) return;
  _ratios[srcProduct.id] = v;
  saveRatios();
  updateRuleUI(srcProduct);
  updatePreview();
  showToast('✅ 분할 비율이 저장됐습니다', 'ok');
}

function clearCustomRatio() {
  if (!srcProduct) return;
  delete _ratios[srcProduct.id];
  saveRatios();
  updateRuleUI(srcProduct);
  updatePreview();
  showToast('비율 초기화 완료', 'ok');
}

// ── 미리보기 ────────────────────────────────────────────────────
function updatePreview() {
  const qty = parseInt(document.getElementById('qtyInput').value) || 0;
  const wrap = document.getElementById('previewWrap');
  const btn  = document.getElementById('submitBtn');

  if (!srcProduct || !dstProduct || qty <= 0) {
    wrap.style.display = 'none'; btn.disabled = true; return;
  }

  const ratio = parseInt(document.getElementById('ratioInput').value) || getEffectiveRatio(srcProduct.id, srcProduct.name);
  const added = qty * ratio;

  document.getElementById('prevSrcName').textContent   = srcProduct.name;
  document.getElementById('prevDstName').textContent   = dstProduct.name;
  document.getElementById('prevSrcBefore').textContent = srcProduct.stock;
  document.getElementById('prevDstBefore').textContent = dstProduct.stock;
  document.getElementById('prevSrcAfter').textContent  = srcProduct.stock - qty;
  document.getElementById('prevDstAfter').textContent  = dstProduct.stock + added;
  document.getElementById('prevSrcDiff').textContent   = `(-${qty})`;
  document.getElementById('prevDstDiff').textContent   = `(+${added})`;
  document.getElementById('prevRatio').textContent     = `1개 분할 → ${ratio}개 증가`;

  wrap.style.display = ''; btn.disabled = false;
}

// ── Split 실행 ──────────────────────────────────────────────────
async function doSplit() {
  const qty   = parseInt(document.getElementById('qtyInput').value) || 0;
  const ratio = parseInt(document.getElementById('ratioInput').value) || getEffectiveRatio(srcProduct.id, srcProduct.name);
  const note  = document.getElementById('noteInput').value.trim();
  if (!srcProduct || !dstProduct || qty <= 0) return;

  document.getElementById('submitBtn').disabled = true;
  try {
    const r = await fetch(`${API}/api/stock/split`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from_product_id: srcProduct.id,
        to_product_id:   dstProduct.id,
        qty, ratio,
        note: note || null,
      }),
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || '오류'); }
    const res = await r.json();
    showToast(`✅ Split 완료: ${res.from_product} -${res.qty_removed} / ${res.to_product} +${res.qty_added}`, 'ok');
    bc.postMessage('split-updated');

    srcProduct.stock = res.from_stock_after;
    dstProduct.stock = res.to_stock_after;
    const sp = _products.find(x => x.id === srcProduct.id);
    const dp = _products.find(x => x.id === dstProduct.id);
    if (sp) sp.stock = res.from_stock_after;
    if (dp) dp.stock = res.to_stock_after;

    updatePreview();
    loadHistory();
    refreshPanel();
  } catch(e) {
    showToast('❌ ' + e.message, 'err');
  }
  document.getElementById('submitBtn').disabled = false;
}

// ── 이력 ────────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const r = await fetch(`${API}/api/stock/movements?type=adj&limit=500`);
    const data = await r.json();
    const splits = data.filter(m => m.note && m.note.toLowerCase().includes('split'));

    // created_at 초 단위로 쌍 묶기
    const groups = {};
    splits.forEach(m => {
      const key = (m.created_at || '').slice(0, 19);
      if (!groups[key]) groups[key] = [];
      groups[key].push(m);
    });

    // 최신순 20쌍
    const pairs = Object.entries(groups)
      .sort((a, b) => b[0].localeCompare(a[0]))
      .slice(0, 20);

    const tbody = document.getElementById('histBody');
    if (!pairs.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--fg3);padding:20px">이력 없음</td></tr>';
      return;
    }

    tbody.innerHTML = pairs.map(([ts, ms]) => {
      const dt   = ts.replace('T', ' ').slice(0, 16);
      const src  = ms.find(m => m.quantity < 0);
      const dst  = ms.find(m => m.quantity > 0);
      const ids  = ms.map(m => m.id).join(',');
      const srcName = src ? src.product_name : '—';
      const dstName = dst ? dst.product_name : '—';
      const srcQty  = src ? src.quantity : '';
      const dstQty  = dst ? '+' + dst.quantity : '';
      return `<tr id="hist-row-${ts.replace(/[^0-9]/g,'')}">
        <td class="mono" style="font-size:11px">${dt}</td>
        <td style="font-size:12px">${srcName}</td>
        <td style="font-size:12px;color:var(--fg3)">${dstName}</td>
        <td class="mono" style="text-align:center;font-size:12px"><span style="color:#e06b8b">${srcQty}</span> / <span style="color:#22c55e">${dstQty}</span></td>
        <td style="text-align:center">
          <button onclick="deleteHistory('${ts.replace(/[^0-9]/g,'')}', [${ids}])"
            style="background:none;border:1px solid #e06b8b;border-radius:4px;color:#e06b8b;font-size:11px;padding:2px 8px;cursor:pointer">삭제</button>
        </td>
      </tr>`;
    }).join('');
  } catch(e) { console.error(e); }
}

async function deleteHistory(rowKey, ids) {
  if (!confirm('이 Split 이력을 삭제하시겠습니까?\n재고도 원래대로 되돌아갑니다.')) return;
  try {
    for (const id of ids) {
      const r = await fetch(`${API}/api/stock/movements/${id}`, { method: 'DELETE' });
      if (!r.ok) throw new Error(await r.text());
    }
    const row = document.getElementById(`hist-row-${rowKey}`);
    if (row) row.remove();
    showToast('삭제됨', 'ok');
    bc.postMessage('split-updated');
    // 패널 재고 갱신
    _products = await fetch(`${API}/api/products?limit=2000`).then(r=>r.json());
    refreshPanel();
  } catch(e) {
    showToast('삭제 실패: ' + e.message, 'err');
  }
}

/* ── Context menu (split) ── */
let _splCtxProduct = null;
const splCtxMenu = document.getElementById('spl-ctx-menu');
document.getElementById('panelList').addEventListener('contextmenu', e => {
  const item = e.target.closest('.panel-item');
  if (!item) return;
  e.preventDefault();
  const pg = item.closest('[id^="pg-"]');
  if (!pg) return;
  const id = parseInt(pg.id.replace('pg-', ''));
  _splCtxProduct = _products.find(p => p.id === id) || null;
  if (!_splCtxProduct) return;
  const x = Math.min(e.clientX, window.innerWidth  - splCtxMenu.offsetWidth  - 8);
  const y = Math.min(e.clientY, window.innerHeight - splCtxMenu.offsetHeight - 8);
  splCtxMenu.style.left = x + 'px'; splCtxMenu.style.top = y + 'px';
  splCtxMenu.style.display = 'block';
});
document.addEventListener('click', () => splCtxMenu.style.display = 'none');
document.addEventListener('keydown', e => { if (e.key === 'Escape') splCtxMenu.style.display = 'none'; });
function splCtxCopyRow() {
  if (!_splCtxProduct) return;
  const p = _splCtxProduct;
  const text = [p.barcode || '', p.name || '', p.stock].join('\t');
  navigator.clipboard.writeText(text).then(() => showToast('✅ 제품 전체 복사됨', 'ok')).catch(() => showToast('복사 실패', 'err'));
}
function splCtxCopyBarcode() {
  if (!_splCtxProduct) return;
  navigator.clipboard.writeText(_splCtxProduct.barcode || '').then(() => showToast('✅ 바코드 복사됨', 'ok')).catch(() => showToast('복사 실패', 'err'));
}
function splCtxCopyName() {
  if (!_splCtxProduct) return;
  navigator.clipboard.writeText(_splCtxProduct.name || '').then(() => showToast('✅ 제품명 복사됨', 'ok')).catch(() => showToast('복사 실패', 'err'));
}

function showToast(msg, type) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

document.addEventListener('click', e => {
  ['src','dst'].forEach(s => {
    if (!document.getElementById(s+'Input').contains(e.target) &&
        !document.getElementById(s+'Drop').contains(e.target)) {
      document.getElementById(s+'Drop').style.display = 'none';
    }
  });
  const addWrap = document.getElementById('addSearchWrap');
  const addBtn  = document.querySelector('.panel-add-btn');
  if (_addOpen && addWrap && !addWrap.contains(e.target) && e.target !== addBtn) {
    _addOpen = false;
    addWrap.style.display = 'none';
  }
  if (_editingPairId !== null) {
    const prow = document.getElementById(`prow-${_editingPairId}`);
    if (prow && !prow.contains(e.target)) {
      _editingPairId = null;
      refreshPanel();
    }
  }
});

loadProducts().then(loadHistory);
</script>
